<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Герб Третьего по правилам эльфийской геральдики Толкина (Hammond & Scull, по статье Tolkien Gateway «Heraldry»):
       квадрат — общий (безличный) знак, знак дома; ни один луч не касается края — ранг не заявлен;
       симметрия нарушена нарочно (как фазы Луны у Эарендиля): третья звезда — только контур. 19.10.2026 -->
  <defs>
    <path id="zv" d="M0,-34 L7,-7 L34,0 L7,7 L0,34 L-7,7 L-34,0 L-7,-7 Z"/>
  </defs>
  <!-- поле и кайма -->
  <rect x="10" y="10" width="580" height="580" fill="#141414" stroke="#c9a54a" stroke-width="6"/>
  <rect x="28" y="28" width="544" height="544" fill="none" stroke="#c9a54a" stroke-width="1.5" stroke-dasharray="2 9"/>
  <!-- угловые знаки: по три точки, счёт, который не сходится -->
  <g fill="#c9a54a">
    <circle cx="62" cy="62" r="4"/><circle cx="80" cy="62" r="4"/><circle cx="62" cy="80" r="4"/>
    <circle cx="538" cy="62" r="4"/><circle cx="520" cy="62" r="4"/><circle cx="538" cy="80" r="4"/>
    <circle cx="62" cy="538" r="4"/><circle cx="80" cy="538" r="4"/><circle cx="62" cy="520" r="4"/>
    <circle cx="538" cy="538" r="4"/><circle cx="520" cy="538" r="4"/><circle cx="538" cy="520" r="4"/>
  </g>
  <!-- круг: снег (белое кольцо) и ночь (синее поле) -->
  <circle cx="300" cy="300" r="222" fill="#efe9dc"/>
  <circle cx="300" cy="300" r="210" fill="#6b9ac4"/>
  <circle cx="300" cy="300" r="202" fill="#1b2a5c"/>
  <!-- путь: окружность, по которой идут трое -->
  <circle cx="300" cy="300" r="120" fill="none" stroke="#efe9dc" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- двое, которых можно сосчитать -->
  <use href="#zv" transform="translate(196,360)" fill="#f4f1ea"/>
  <use href="#zv" transform="translate(404,360)" fill="#f4f1ea"/>
  <!-- третий: только контур, пунктиром -->
  <use href="#zv" transform="translate(300,180)" fill="none" stroke="#f4f1ea" stroke-width="2" stroke-dasharray="5 5"/>
  <!-- середина пуста: тот, к кому обращены слова, не нарисован -->
  <circle cx="300" cy="300" r="16" fill="none" stroke="#c9a54a" stroke-width="2"/>
</svg>
